# Only build amd64 flavour to reduce disk usage
[[flavour]]
name = 'amd64'
[flavour.defs]
is_default = true
[flavour.description]
hardware = '64-bit PCs'
hardware_long = 'PCs with AMD64, Intel 64 or VIA Nano processors'
[flavour.packages]
installer = true

# Disabled cloud-amd64 and rt to reduce disk usage during build
# [[flavour]]
# name = 'cloud-amd64'

[[featureset]]
name = 'none'

# Disabled RT featureset to reduce disk usage
# [[featureset]]
# name = 'rt'

[build]
enable_signed = true
enable_vdso = true
kernel_file = 'arch/x86/boot/bzImage'
kernel_stem = 'vmlinuz'

[relations.image]
suggests = ['grub-pc | grub-efi-amd64 | extlinux']
